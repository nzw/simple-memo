<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/icon.css">
    <link rel="stylesheet" href="css/tab.css">
    <script src="js/mode.js"></script>
</head>
<body>
    <div>
      <label class="font-size">Font size:
        <select id="font-size">
          <option value="0.5">0.5em</option>
          <option value="1" selected>1em</option>
          <option value="1.25">1.25em</option>
          <option value="1.5">1.5em</option>
          <option value="1.75">1.75em</option>
          <option value="2">2em</option>
          <option value="2.5">2.5em</option>
          <option value="3">3em</option>
          <option value="3.5">3.5em</option>
          <option value="4">4em</option>
          <option value="4.5">4.5em</option>
          <option value="5">5em</option>
        </select>
      </label>
    </div>
    <div class="cp_tab">
        <div id="tab-bar" class="tab-bar" role="tablist"></div>
        <div id="tab-panels" class="cp_tabpanels"></div>
    </div>
    <div class="footer">
        <span class="msg">
            Auto save in local env... / Shortcut key: "Ctrl+Shift+Z"
        </span>
        <br />
        <a href="#" id="close" class="round_btn"></a>
        <a class="gg-software-download" href="#" id="download" download="SimpleMemoPad.txt"></a>
        <p id="zoom-out" class="dli-zoom-out"><span></span></p>
        <p id="zoom-in" class="dli-zoom-in"><span></span></p>
        <a href="#" id="pin" class="pin-btn" title="サイドパネルに固定">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
            <span>サイドパネルに固定</span>
        </a>
    </div>
    <script src="js/tabs.js"></script>
    <script src="js/zoom.js"></script>
    <script src="js/download.js"></script>
    <script src="js/pin.js"></script>
</body>
</html>
